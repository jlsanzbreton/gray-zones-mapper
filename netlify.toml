# Sitio estático: no hay build, Netlify publica la raíz del repo tal cual.
[build]
  publish = "."
  command = ""

# El service worker nunca debe quedarse en caché, o las actualizaciones no llegan.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Cabeceras de seguridad para todo el sitio.
# CSP: solo se carga lo que viene de este mismo dominio (sin scripts externos ni inline).
# Los estilos inline se permiten porque la matriz los usa para dibujar el SVG.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"

# Atajos cómodos para el vídeo y el curso.
[[redirects]]
  from = "/app"
  to = "/app/"
  status = 301

[[redirects]]
  from = "/matriz"
  to = "/app/"
  status = 301

# El diario (antiguo gray-zones-v3) volverá en /diario. Mientras tanto, a la landing.
[[redirects]]
  from = "/diario/*"
  to = "/"
  status = 302
