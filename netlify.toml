# Sitio estático: no hay build, Netlify publica la raíz del repo tal cual.
[build]
  publish = "."
  command = ""

# El service worker nunca debe quedarse en caché, o las actualizaciones no llegan.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Atajos cómodos para el vídeo y el curso.
[[redirects]]
  from = "/app"
  to = "/app/"
  status = 301

[[redirects]]
  from = "/matriz"
  to = "/app/"
  status = 301

# El diario (antiguo gray-zones-v3) volverá en /diario. Mientras tanto, a la landing.
[[redirects]]
  from = "/diario/*"
  to = "/"
  status = 302
